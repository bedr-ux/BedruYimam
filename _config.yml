  integrity:
    css: "sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htFnhT9ljN3JJw="
    js: "sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA="
medium_zoom:
